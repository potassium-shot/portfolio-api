[package]
name = "portfolio-api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "gif", "webp"] }
potassium-shot-plugin = { git = "https://github.com/potassium-shot/potassium-shot-api.git", tag = "plugin-0.1.1" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
